name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:        
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: echo "CI=false" >> $GITHUB_ENV
